# nginx vhost for devslab-kit-admin-ui
#
# Serves the Vite-built SPA from /usr/share/nginx/html, with two important behaviours:
#
#   1. /admin/api/* is reverse-proxied to the configured admin-api service so
#      browsers never hit a CORS preflight (override via ADMIN_API_UPSTREAM env
#      in compose / k8s; defaults to the docker-compose service name).
#   2. Everything else falls back to /index.html for client-side routing
#      (Vue Router history mode).

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen      80;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    # gzip text assets — webp/woff/images are already compressed
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/ttf
        font/woff
        font/woff2;

    # Lightweight healthcheck for Docker / k8s readiness probes.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Vite hashed assets — safe to cache forever.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Reverse-proxy the admin REST surface so the SPA can hit /admin/api/* directly.
    location /admin/api/ {
        proxy_pass         http://admin-api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 60s;
    }

    # SPA fallback — always serve index.html for unknown paths so Vue Router
    # owns the routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
